name: deploy

# Every push to main goes live on the VPS (spec 035, ADR 0018), after the same
# gates as any pull request. The server side is ops/deploy-vps.sh.
on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time, in order. A running deploy is never cancelled halfway.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/quality.yml

  deploy:
    needs: checks
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: production
      url: https://theredflyingdragon.com
    steps:
      - name: Load the deploy key
        env:
          DEPLOY_KEY: ${{ secrets.VPS_DEPLOY_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      # The key is bound to one command on the server; this line only says which commit.
      - name: Deploy ${{ github.sha }}
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          ssh -i ~/.ssh/deploy_key \
            -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=10 \
            "root@$VPS_HOST" "deploy $GITHUB_SHA"

      - name: Check the public site
        run: |
          for attempt in 1 2 3 4 5 6; do
            body=$(curl -fsS --max-time 20 https://theredflyingdragon.com/ || true)
            if grep -q "Join the Tea List" <<<"$body"; then
              echo "theredflyingdragon.com is up"
              exit 0
            fi
            sleep 10
          done
          echo "::error::theredflyingdragon.com did not serve the page after the deploy"
          exit 1

      - name: Forget the key
        if: always()
        run: rm -f ~/.ssh/deploy_key
