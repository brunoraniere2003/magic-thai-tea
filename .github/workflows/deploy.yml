name: deploy

# Every push to main goes live on the VPS (spec 035, ADR 0018). No test gate in
# front of it (spec 036): the server builds first and keeps the old site up if
# the build fails, and puts it back if the new one does not answer. The server
# side is ops/deploy-vps.sh. Tests still run on pull requests (quality.yml).
on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time, in order. A running deploy is never cancelled halfway.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: production
      url: https://theredflyingdragon.com
    steps:
      - name: Load the deploy key
        env:
          DEPLOY_KEY: ${{ secrets.VPS_DEPLOY_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      # The key is bound to one command on the server; this line only says which commit.
      # The Stripe key rides along on stdin (never on the command line, never in
      # a log): the server writes it to .env.production. Empty secret, no change.
      - name: Deploy ${{ github.sha }}
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
        # ssh exits 255 only when the connection itself failed: try again. Any
        # other code is the server's answer (a failed build, say) and is final.
        # A retry after a drop is safe: the server finishes a deploy even when
        # nobody is connected, and then answers "already live". If every try
        # fails, the server's own 5-minute timer publishes this commit (spec 037).
        run: |
          for attempt in 1 2 3 4; do
            set +e
            ssh -i ~/.ssh/deploy_key \
              -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 \
              -o ServerAliveInterval=30 -o ServerAliveCountMax=10 \
              "root@$VPS_HOST" "deploy $GITHUB_SHA" \
              <<<"STRIPE_SECRET_KEY=$STRIPE_SECRET_KEY"
            code=$?
            set -e
            [ "$code" -ne 255 ] && exit "$code"
            echo "::warning::connection to the server failed (attempt $attempt), retrying"
            sleep $((attempt * 20))
          done
          echo "::warning::could not reach the server; its 5-minute timer will publish this commit"
          exit 1

      - name: Check the public site
        run: |
          for attempt in 1 2 3 4 5 6; do
            body=$(curl -fsS --max-time 20 https://theredflyingdragon.com/ || true)
            # A Next page, whatever its wording: Ethan edits the copy, so no phrase is checked.
            if grep -q "/_next/static" <<<"$body"; then
              echo "theredflyingdragon.com is up"
              exit 0
            fi
            sleep 10
          done
          echo "::error::theredflyingdragon.com did not serve the page after the deploy"
          exit 1

      - name: Forget the key
        if: always()
        run: rm -f ~/.ssh/deploy_key
